name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Test usage metrics, speed, and diff ownership
        run: node --test tests/diff-slot.test.mjs tests/metrics.test.mjs tests/speed.test.mjs
      - name: Test shared speed delivery through both platform adapters
        run: python -B tests/shared-speed.test.py
      - name: Test signing policy
        run: python -B tests/signing.test.py
      # These suites use disposable fixtures and mocked app processes/signatures.
      # They never download, install, sign, or launch the desktop app.
      - name: Test macOS integrity, recovery, and setup guards
        if: runner.os == 'macOS'
        run: |
          python -B tests/startup_health.test.py
          python -B tests/integrity.test.py
          python -B tests/acceptance.test.py
          python -B tests/launch_identity.test.py
          python -B tests/install.test.py
          python -B tests/protected_recovery.test.py
          python -B tests/worker.test.py
          python -B tests/setup.test.py
      - name: Test Windows integrity, deployment, and locking
        if: runner.os == 'Windows'
        run: python -B tests/windows.test.py
